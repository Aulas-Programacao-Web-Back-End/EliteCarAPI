name: Keep Render API Alive

on:
  schedule:
    # Executa a cada 10 minutos
    - cron: "*/10 * * * *"

  # Permite executar manualmente pelo GitHub
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render API
        run: |
          curl --fail --silent --show-error \
            --max-time 30 \
            https://SUA-API.onrender.com/health
